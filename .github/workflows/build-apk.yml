name: Build Flint Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'overlay/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Flint overlay
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git curl wget unzip zip jq build-essential cmake ninja-build patchelf openjdk-17-jdk libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-icccm4

      - name: Python tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan==2.28.0" "aqtinstall==3.3.0" "py7zr==0.22.*"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Install Android platform and NDK
        shell: bash
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-30" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.11718014"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Qt 6.10.3
        run: |
          aqt install-qt linux desktop 6.10.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt" -m qtremoteobjects qt5compat qtimageformats qtshadertools
          aqt install-qt all_os android 6.10.3 android_arm64_v8a -O "$RUNNER_TEMP/Qt" -m qtremoteobjects qt5compat qtimageformats qtshadertools

      - name: Clone Amnezia Client
        run: |
          git clone --recursive --depth 1 --shallow-submodules --branch 5.0.3.0 https://github.com/amnezia-vpn/amnezia-client.git "$RUNNER_TEMP/amnezia-client"

      - name: Apply Flint 8.9.4
        run: |
          python3 scripts/apply-flint.py "$RUNNER_TEMP/amnezia-client"

      - name: Build Flint Android ARM64
        shell: bash
        run: |
          set -e
          KEYSTORE="$RUNNER_TEMP/flint-release.keystore"
          SIGN_PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" -alias flint -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flint, OU=Mobile, O=Flint, L=NA, ST=NA, C=US"
          export QT_INSTALL_DIR="$RUNNER_TEMP"
          export QT_VERSION="6.10.3"
          export ANDROID_NDK_VERSION="27.0.11718014"
          export APP_ANDROID_MIN_SDK="30"
          export APP_ANDROID_VERSION_CODE_OFFSET="894"
          export QT_ANDROID_KEYSTORE_PATH="$KEYSTORE"
          export QT_ANDROID_KEYSTORE_ALIAS="flint"
          export QT_ANDROID_KEYSTORE_STORE_PASS="$SIGN_PASS"
          export QT_ANDROID_KEYSTORE_KEY_PASS="$SIGN_PASS"
          export JOBS="2"
          cd "$RUNNER_TEMP/amnezia-client"
          ./deploy/build.sh -t android --sign --abi arm64-v8a --force

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          exact="$RUNNER_TEMP/amnezia-client/deploy/build/client/android-build/AmneziaVPN.apk"
          if [ -f "$exact" ]; then
            cp "$exact" out/Flint-v8.9.4-Android-arm64.apk
          else
            apk="$(find "$RUNNER_TEMP/amnezia-client/deploy" -type f -name '*.apk' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$apk"
            cp "$apk" out/Flint-v8.9.4-Android-arm64.apk
          fi
          sha256sum out/Flint-v8.9.4-Android-arm64.apk > out/Flint-v8.9.4-Android-arm64.apk.sha256
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flint-Android-v8.9.4
          path: |
            out/Flint-v8.9.4-Android-arm64.apk
            out/Flint-v8.9.4-Android-arm64.apk.sha256
          retention-days: 30
