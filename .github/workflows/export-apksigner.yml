name: Export Android apksigner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-apksigner.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;35.0.0"

      - name: Pack apksigner
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" dist/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/
          chmod +x dist/apksigner
          sha256sum dist/apksigner dist/apksigner.jar > dist/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: dist/*
          retention-days: 2
