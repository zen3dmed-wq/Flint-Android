name: Build Flint Android 8.10.7

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flint-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y qt6-base-dev cmake ninja-build
      - name: Compile and check controller
        run: |
          cmake -S tests/controller -B /tmp/flint-controller-tests -G Ninja
          cmake --build /tmp/flint-controller-tests
          ctest --test-dir /tmp/flint-controller-tests --output-on-failure
      - name: Check widget state and action policy
        run: |
          curl --fail --location --silent --show-error https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip -o /tmp/kotlin.zip
          echo 'b6698d5728ad8f9edcdd01617d638073191d8a03139cc538a391b4e3759ad297  /tmp/kotlin.zip' | sha256sum --check
          unzip -q /tmp/kotlin.zip -d /tmp/flint-kotlin
          /tmp/flint-kotlin/kotlinc/bin/kotlinc flint/widget/FlintWidgetModel.kt tests/widget/FlintWidgetModelTest.kt -include-runtime -d /tmp/flint-widget-tests.jar
          java -jar /tmp/flint-widget-tests.jar
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt: android_arm64_v8a
            label: arm64
          - abi: armeabi-v7a
            qt: android_armv7
            label: armv7
    needs: controller-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QT_VERSION: '6.10.3'
      ANDROID_PLATFORM: android-30
      APP_ANDROID_MIN_SDK: 30
      NDK_VERSION: 27.0.11718014

    steps:
      - name: Checkout Flint
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Go / gomobile
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Install build Python tools
        run: |
          python -m pip install --upgrade pip
          pip install "conan==2.28.0" "aqtinstall==3.3.0" "py7zr==0.22.*"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Android SDK / NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-30 build-tools;35.0.0 ndk;27.0.11718014"

      - name: Install Qt desktop host
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '${{ env.QT_VERSION }}'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
          dir: '${{ runner.temp }}'
          set-env: true

      - name: Install Qt Android ${{ matrix.label }}
        shell: bash
        run: |
          aqt install-qt all_os android "$QT_VERSION" ${{ matrix.qt }} \
            -O "${{ runner.temp }}/Qt" \
            -m qtremoteobjects qt5compat qtimageformats qtshadertools

      - name: Clone stable Amnezia engine
        shell: bash
        run: |
          git clone --recursive --branch 5.0.3.0 \
            https://github.com/amnezia-vpn/amnezia-client.git amnezia-client

      - name: Apply Flint Android 8.10.7
        shell: bash
        run: |
          python3 build_flint.py amnezia-client
          python3 tests/test_android_identity.py amnezia-client

      - name: Verify Flint source before build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:label="Flint"' amnezia-client/client/android/AndroidManifest.xml
          grep -q 'applicationId = "app.flint.vpn"' amnezia-client/client/android/build.gradle.kts
          grep -q 'zakupki.gov.ru' amnezia-client/client/core/repositories/secureAppSettingsRepository.cpp
          grep -q '/auth/telegram/bot/start' amnezia-client/client/ui/controllers/flintController.cpp
          grep -q 'parseSubscriptionProfiles' amnezia-client/client/ui/controllers/flintController.cpp
          ! grep -q 'PageSetupWizardStart' amnezia-client/client/ui/qml/Pages2/PageStart.qml
          grep -q 'source: "PageHome.qml"' amnezia-client/client/ui/qml/Pages2/PageStart.qml
          grep -q 'Loader {' amnezia-client/client/ui/qml/Pages2/PageStart.qml
          grep -q 'Flickable' amnezia-client/client/ui/qml/Pages2/PageHome.qml
          ! grep -q 'anchors.centerIn: Overlay.overlay' amnezia-client/client/ui/qml/Pages2/PageHome.qml
          grep -q 'android:name="org.amnezia.vpn.AmneziaApplication"' amnezia-client/client/android/AndroidManifest.xml
          grep -q 'android:name="org.amnezia.vpn.AmneziaActivity"' amnezia-client/client/android/AndroidManifest.xml
          if command -v qmlformat >/dev/null 2>&1; then
            qmlformat amnezia-client/client/ui/qml/Pages2/PageHome.qml >/dev/null
            qmlformat amnezia-client/client/ui/qml/Pages2/PageStart.qml >/dev/null
          fi

      - name: Check Flint public API
        shell: bash
        run: |
          set +e
          if curl --fail --silent --show-error --max-time 15 \
            https://flintmain.ru/api/v1/config -o /tmp/flint-config.json; then
            python3 - <<'PY'
          import json
          p="/tmp/flint-config.json"
          with open(p, "r", encoding="utf-8") as f:
              data=json.load(f)
          assert isinstance(data, dict), "Flint /config must return a JSON object"
          print("Flint public API: OK")
          PY
          else
            echo "Flint API timeout: continuing build because the client has cached-profile fallback"
          fi
          exit 0

      - name: Build Flint Android ${{ matrix.label }} APK
        shell: bash
        env:
          QT_INSTALL_DIR: '${{ runner.temp }}'
          ANDROID_HOME: '${{ env.ANDROID_HOME }}'
          ANDROID_NDK_VERSION: '${{ env.NDK_VERSION }}'
          APP_ANDROID_MIN_SDK: '30'
        run: |
          cd amnezia-client
          deploy/build.sh -t android --abi ${{ matrix.abi }}
          cd ..
          mkdir -p dist
          find amnezia-client/deploy -type f -name '*.apk' -print -exec cp -f {} dist/ \;
          APK=$(find dist -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          mv "$APK" dist/Flint-v8.10.7-Android-${{ matrix.label }}.apk
          sha256sum dist/Flint-v8.10.7-Android-${{ matrix.label }}.apk > dist/Flint-v8.10.7-Android-${{ matrix.label }}.apk.sha256

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/Flint-v8.10.7-Android-${{ matrix.label }}.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee dist/aapt-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee dist/aapt-manifest.txt
          grep -F "package: name='app.flint.vpn'" dist/aapt-badging.txt
          grep -F "application-label:'Flint'" dist/aapt-badging.txt
          grep -F "versionName='8.10.7'" dist/aapt-badging.txt
          grep -F "org.amnezia.vpn.AmneziaApplication" dist/aapt-manifest.txt
          grep -F "org.amnezia.vpn.AmneziaActivity" dist/aapt-manifest.txt
          unzip -t "$APK"
          test $(stat -c%s "$APK") -gt 10000000

      - name: Upload Flint APK
        uses: actions/upload-artifact@v4
        with:
          name: Flint-v8.10.7-Android-${{ matrix.label }}
          path: |
            dist/Flint-v8.10.7-Android-${{ matrix.label }}.apk
            dist/Flint-v8.10.7-Android-${{ matrix.label }}.apk.sha256
            dist/aapt-badging.txt
            dist/aapt-manifest.txt
          retention-days: 14
