name: Build Flint iOS unsigned
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'build_ios.py'
      - 'build_flint.py'
      - 'patch_android_identity.py'
      - 'patch_android_widget.py'
      - 'patch_direct_sites.py'
      - 'patch_qr_images.py'
      - 'patch_vpn_permission.py'
      - 'patch_routing.py'
      - 'tests/qr/**'
      - 'flint/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flint-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-arm64:
    # Cross-compile the same iPhone arm64 target on the standard Intel host pool.
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      QT_VERSION: '6.10.3'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Build tools
        run: python -m pip install 'conan==2.28.0' 'aqtinstall==3.3.0' 'py7zr==0.22.*' jsonschema jinja2
      - name: Qt macOS host
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '${{ env.QT_VERSION }}'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools qtmultimedia'
          dir: '${{ runner.temp }}'
      - name: Test real QR image decoder on macOS
        run: |
          cmake -S tests/qr -B "$RUNNER_TEMP/qr-checks" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          cmake --build "$RUNNER_TEMP/qr-checks"
          "$RUNNER_TEMP/qr-checks/qr-image-checks"
      - name: Qt iOS
        run: aqt install-qt mac ios "$QT_VERSION" ios -O "$RUNNER_TEMP/Qt" -m qtremoteobjects qt5compat qtimageformats qtshadertools qtmultimedia
      - name: Engine and Flint integration
        run: |
          git clone --recursive --branch 5.0.3.0 https://github.com/amnezia-vpn/amnezia-client.git amnezia-client
          python build_ios.py amnezia-client
          python ios/test_recipe.py amnezia-client
      - name: Compile app and packet tunnel
        env:
          QT_ROOT_PATH: '${{ runner.temp }}/Qt/${{ env.QT_VERSION }}'
        run: bash ios/build-unsigned.sh "$PWD/amnezia-client" "$PWD/ios-build"
      - name: Verify and archive unsigned app
        run: |
          python ios/verify_bundle.py ios-build | tee ios-build-report.json
          APP=$(find ios-build -type d -name Flint.app -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$APP" Flint-iOS-8.10.28-UNSIGNED.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Flint-iOS-8.10.28-UNSIGNED
          path: |
            Flint-iOS-8.10.28-UNSIGNED.zip
            ios-build-report.json
          if-no-files-found: error
          retention-days: 14
