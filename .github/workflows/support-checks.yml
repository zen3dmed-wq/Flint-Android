name: Flint support controller checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['flint/**', 'tests/controller/**', '.github/workflows/support-checks.yml']
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y qt6-base-dev libssl-dev cmake ninja-build
      - run: cmake -S tests/controller -B /tmp/support-checks -G Ninja && cmake --build /tmp/support-checks && ctest --test-dir /tmp/support-checks --output-on-failure
